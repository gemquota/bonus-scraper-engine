<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scraper Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-900 text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

                const { useState, useEffect, useCallback, useRef } = React;

        function Dashboard() {
            const [stats, setStats] = useState({
                index: 0, successes: 0, failures: 0, total_bonuses: 0, site_url: "Waiting...",
                status_message: "-", N: 0, is_paused: false, is_stopped: false, is_running: true
            });
            const [history, setHistory] = useState([]);
            const [showSettings, setShowSettings] = useState(false);
            const [config, setConfig] = useState({});
            const [auth, setAuth] = useState(() => sessionStorage.getItem("b64auth") || "");
            const [loginOpen, setLoginOpen] = useState(false);
            const loginUser = useRef("admin");
            const loginPass = useRef("");
            const authHeaders = useCallback(() =>
                auth ? { "Authorization": "Basic " + auth } : {}, [auth]);

            function api(url, opts = {}) {
                return fetch(url, { ...opts, headers: { ...opts.headers, ...authHeaders() } })
                    .then(r => { if (r.status === 401 && auth) { setAuth(""); sessionStorage.removeItem("b64auth"); setLoginOpen(true); } return r; });
            }

            const handleControl = useCallback(async (action) => {
                try {
                    const res = await api("/api/control/" + action, { method: 'POST' });
                    const data = await res.json();
                    if (action === 'pause') setStats(prev => ({ ...prev, is_paused: true }));
                    else if (action === 'resume') setStats(prev => ({ ...prev, is_paused: false }));
                    else if (action === 'stop') setStats(prev => ({ ...prev, is_stopped: true, is_paused: false }));
                } catch (err) { console.error("Control error:", err); }
            }, [auth]);

            useEffect(() => {
                api("/api/config").then(r => r.json()).then(setConfig).catch(() => setLoginOpen(true));
                api("/api/status").then(r => r.json()).then(data => {
                    setStats(prev => ({ ...prev, is_paused: data.paused, is_stopped: data.stopped, is_running: data.is_running }));
                }).catch(console.error);
                const ws = new WebSocket("ws://" + window.location.host + "/ws");
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    setStats(prev => ({ ...prev, ...data }));
                    setHistory(prev => [data, ...prev].slice(0, 10));
                };
                ws.onclose = () => {
                    api("/api/status").then(r => r.json()).then(data => {
                        if (!data.is_running && !data.stopped) setStats(prev => ({ ...prev, status_message: "COMPLETED", is_running: false }));
                    }).catch(() => {});
                };
                const ping = setInterval(() => { if (ws.readyState === WebSocket.OPEN) ws.send("ping"); }, 15000);
                return () => { ws.close(); clearInterval(ping); };
            }, [auth]);

            function doLogin(e) {
                e.preventDefault();
                const b64 = btoa(loginUser.current + ":" + loginPass.current);
                setAuth(b64);
                sessionStorage.setItem("b64auth", b64);
                setLoginOpen(false);
            }

            const handleSaveConfig = async (e) => {
                e.preventDefault();
                await api("/api/config", { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(config) });
                setShowSettings(false);
            };

            const updateConfigVal = (section, key, val) => {
                setConfig(prev => ({ ...prev, [section]: { ...(prev[section] || {}), [key]: val } }));
            };

            const isCompleted = !stats.is_running && stats.index > 0 && !stats.is_stopped;
            const showPauseBtn = stats.is_running && !stats.is_stopped;

            return (
                <div class="container py-10 relative">
                    {loginOpen && (
                        <div class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
                            <div class="bg-gray-800 p-8 rounded-lg border border-gray-600 w-full max-w-sm">
                                <h2 class="text-2xl font-bold mb-4 text-cyan-400">Login Required</h2>
                                <form onSubmit={doLogin}>
                                    <div class="mb-4">
                                        <label class="block text-xs uppercase text-gray-500 mb-1">Username</label>
                                        <input type="text" defaultValue="admin" onChange={e => loginUser.current = e.target.value}
                                            class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white" />
                                    </div>
                                    <div class="mb-4">
                                        <label class="block text-xs uppercase text-gray-500 mb-1">Password</label>
                                        <input type="password" onChange={e => loginPass.current = e.target.value}
                                            class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white" />
                                    </div>
                                    <button type="submit" class="bg-cyan-600 hover:bg-cyan-700 text-white px-6 py-2 rounded font-bold w-full">Login</button>
                                </form>
                            </div>
                        </div>
                    )}
                    <div class="flex justify-between items-center mb-8">
                        <h1 class="text-4xl font-bold text-cyan-400">Scraper Command Center</h1>
                        <div class="flex gap-2">
                            <button onClick={() => setShowSettings(true)} class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded font-bold transition mr-4">\u2699\ufe0f SETTINGS</button>
                            {showPauseBtn && (stats.is_paused ? (
                                <button onClick={() => handleControl('resume')} class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded font-bold transition animate-pulse">RESUME</button>
                            ) : (
                                <button onClick={() => handleControl('pause')} class="bg-yellow-600 hover:bg-yellow-700 text-white px-4 py-2 rounded font-bold transition">PAUSE</button>
                            ))}
                            {showPauseBtn && (
                                <button onClick={() => handleControl('stop')} class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded font-bold transition">STOP</button>
                            )}
                        </div>
                    </div>
                    {showSettings && (
                        <div class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
                            <div class="bg-gray-800 p-8 rounded-lg border border-gray-600 w-full max-w-lg">
                                <h2 class="text-2xl font-bold mb-4 text-cyan-400">Configuration</h2>
                                <form onSubmit={handleSaveConfig}>
                                    <div class="mb-4">
                                        <h3 class="font-bold text-gray-400 mb-2">SETTINGS</h3>
                                        <div class="grid grid-cols-2 gap-4">
                                            <div>
                                                <label class="block text-xs uppercase text-gray-500 mb-1">Min Delay</label>
                                                <input type="number" step="0.1" value={config?.SETTINGS?.min_delay || ''}
                                                    onChange={e => updateConfigVal('SETTINGS', 'min_delay', e.target.value)}
                                                    class="w-full bg-gray-900 border border-gray-700 rounded p-2" />
                                            </div>
                                            <div>
                                                <label class="block text-xs uppercase text-gray-500 mb-1">Max Delay</label>
                                                <input type="number" step="0.1" value={config?.SETTINGS?.max_delay || ''}
                                                    onChange={e => updateConfigVal('SETTINGS', 'max_delay', e.target.value)}
                                                    class="w-full bg-gray-900 border border-gray-700 rounded p-2" />
                                            </div>
                                        </div>
                                    </div>
                                    <div class="flex justify-end gap-2 mt-6">
                                        <button type="button" onClick={() => setShowSettings(false)} class="text-gray-400 hover:text-white px-4 py-2">Cancel</button>
                                        <button type="submit" class="bg-cyan-600 hover:bg-cyan-700 text-white px-6 py-2 rounded font-bold">Save Changes</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                    {stats.is_paused && (
                        <div class="bg-yellow-900 border border-yellow-700 text-yellow-200 px-4 py-2 rounded mb-6 text-center font-bold animate-pulse">SYSTEM PAUSED</div>
                    )}
                    {stats.is_stopped && (
                        <div class="bg-red-900 border border-red-700 text-red-200 px-4 py-2 rounded mb-6 text-center font-bold">SYSTEM STOPPED</div>
                    )}
                    {isCompleted && (
                        <div class="bg-green-900 border border-green-700 text-green-200 px-4 py-2 rounded mb-6 text-center font-bold">SCRAPING COMPLETED</div>
                    )}
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-10">
                        <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
                            <div class="text-gray-400 text-sm uppercase">Progress</div>
                            <div class="text-3xl font-bold">{stats.index} / {stats.N}</div>
                        </div>
                        <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
                            <div class="text-gray-400 text-sm uppercase">Success Rate</div>
                            <div class="text-3xl font-bold text-green-400">{stats.index > 0 ? ((stats.successes / stats.index) * 100).toFixed(1) : 0}%</div>
                        </div>
                        <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
                            <div class="text-gray-400 text-sm uppercase">Total Bonuses</div>
                            <div class="text-3xl font-bold text-yellow-400">{stats.total_bonuses}</div>
                        </div>
                        <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
                            <div class="text-gray-400 text-sm uppercase">Failures</div>
                            <div class="text-3xl font-bold text-red-400">{stats.failures}</div>
                        </div>
                    </div>
                    <div class="bg-gray-800 rounded-lg overflow-hidden border border-gray-700">
                        <div class="p-4 bg-gray-700 font-bold">Live Activity</div>
                        <table class="w-full text-left">
                            <thead class="bg-gray-800 text-gray-400 text-xs uppercase">
                                <tr><th class="p-4">Site</th><th class="p-4">Status</th><th class="p-4">New</th><th class="p-4">ETC</th></tr>
                            </thead>
                            <tbody>
                                {history.map((row, i) => (
                                    <tr key={i} class="border-t border-gray-700 hover:bg-gray-750 transition">
                                        <td class="p-4 font-mono text-sm">{row.site_url}</td>
                                        <td class="p-4">
                                            <span class={"px-2 py-1 rounded text-xs " + (row.status_message && row.status_message.includes('\u2705') ? 'bg-green-900 text-green-300' : 'bg-red-900 text-red-300')}>
                                                {row.status_message}
                                            </span>
                                        </td>
                                        <td class="p-4 text-cyan-400">+{row.site_bonuses_gt_zero || 0}</td>
                                        <td class="p-4 text-gray-500 text-xs">{row.elapsed?.toFixed(2)}s</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
